# Alembic configuration for PA Evidence Assistant
# The sqlalchemy.url is set programmatically in migrations/env.py from
# the application settings — do NOT set it here (it would embed credentials
# in the config file committed to version control).

[alembic]
script_location = app/db/migrations
prepend_sys_path = .
version_path_separator = os

# Logging — alembic's own logger
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
