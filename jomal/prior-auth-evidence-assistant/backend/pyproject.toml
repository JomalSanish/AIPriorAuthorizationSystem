[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pa-evidence-assistant"
version = "0.1.0"
description = "Prior Authorization Evidence Assistant - backend"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    # Database
    "sqlalchemy[asyncio]>=2.0.31",
    "asyncpg>=0.29",
    "alembic>=1.13",
    # Settings / secrets
    "pydantic[email]>=2.8",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    # Auth
    "passlib[bcrypt]>=1.7",
    "bcrypt>=3.2,<5.0",  # passlib 1.7.4 requires bcrypt <5.0 (removes __about__)
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.9",
    # HTTP client
    "httpx>=0.27",
    # Document parsing
    "pymupdf>=1.28.2",
    "python-docx==1.1.2",
    # Object storage
    "boto3>=1.34",
    # Vector / embeddings
    "qdrant-client>=1.10",
    "fastembed>=0.7.0",
    # Scheduler
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "anyio>=4.4",
    "ruff>=0.5",
]
# Phase 2 OCR dependencies — install with: pip install -e ".[ocr]"
ocr = [
    "opencv-python-headless",
    "easyocr",
    "numpy",
]
# Phase 10 evaluation dependencies — install with: pip install -e ".[eval]"
eval = [
    "ragas",
    "langchain",
    "langchain-community",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S"]
ignore = ["S101", "B008"]
